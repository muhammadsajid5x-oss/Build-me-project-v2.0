name: Analytics Automation

on:
  push:
    branches:
      - development
      - main
      - "feature/**"

  pull_request:
    branches:
      - development
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  analytics:
    name: Analytics Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: ci-test-key
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_KEY: ci-test-key

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/analytics/requirements.txt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python analytics dependencies
        working-directory: services/analytics
        run: python -m pip install -r requirements.txt

      - name: Run Python analytics tests
        working-directory: services/analytics
        run: python -m pytest

      - name: Migrate database
        run: pnpm --dir database db:migrate

      - name: Build database dependencies
        run: pnpm --filter @build-me/database... build

      - name: Start API
        run: |
          pnpm --filter @build-me/api dev > api.log 2>&1 &
          echo $! > api.pid

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/health > /dev/null; then
              echo "API is ready."
              exit 0
            fi

            sleep 1
          done

          echo "API failed to start."
          cat api.log
          exit 1

      - name: Validate analytics test foundation
        shell: bash
        run: |
          set -e

          required_dirs=(
            "tests/analytics"
            "tests/analytics/devsecops"
            "tests/analytics/features"
            "tests/analytics/features/conversions"
            "tests/analytics/features/events"
            "tests/analytics/features/tracking"
            "tests/analytics/features/validation"
          )

          for dir in "${required_dirs[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "Missing analytics directory: $dir"
              exit 1
            fi
          done

          echo "Analytics test foundation is present."

      - name: Run analytics validation tests
        run: |
          pnpm exec jest \
            --config tests/jest.config.cjs \
            tests/analytics
