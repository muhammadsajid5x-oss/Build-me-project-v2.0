name: Security Automation
on:
  push:
    branches:
      - development
      - main
      - "feature/**"
  pull_request:
    branches:
      - development
      - main

permissions:
  contents: read

jobs:
  security:
    name: Security Validation
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: ci-test-key
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_KEY: ci-test-key

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency Audit
        run: pnpm audit --prod

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build API
        run: pnpm exec turbo run build --filter=@build-me/api

      - name: Start API
        run: |
          pnpm --dir services/api start > api.log 2>&1 &

          for i in {1..30}; do
            if curl -fsS http://localhost:3000/health > /dev/null; then
              echo "API is ready"
              exit 0
            fi

            sleep 2
          done

          echo "API failed to start"
          cat api.log
          exit 1

      - name: SuperTest Security Tests
        run: pnpm exec jest --config tests/jest.config.cjs tests/security/api/api-security.jest.test.ts

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:3000/health"
          rules_file_name: "tests/security/.zap/rules.tsv"
          fail_action: true
          allow_issue_writing: false
