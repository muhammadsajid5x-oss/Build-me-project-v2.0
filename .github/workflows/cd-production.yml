name: CD - Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy to Production
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: ci-test-key
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_KEY: ci-test-key

    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency Audit
        run: pnpm audit --prod

      - name: Build
        run: pnpm build

      - name: Start API
        run: |
          pnpm --dir services/api start > api.log 2>&1 &

          for i in {1..30}; do
            if curl -fsS http://localhost:3000/health > /dev/null; then
              echo "API is ready"
              exit 0
            fi

            sleep 2
          done

          echo "API failed to start"
          cat api.log
          exit 1

      - name: SuperTest Security Tests
        run: pnpm exec jest --config tests/jest.config.cjs tests/security/api/api-security.jest.test.ts

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:3000/health"
          rules_file_name: "tests/security/.zap/rules.tsv"
          fail_action: true
          allow_issue_writing: false

      - name: Deploy API to Production
        run: pnpm exec vercel deploy --yes --prod --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}

      - name: Deploy Dashboard to Production
        run: pnpm exec vercel deploy --yes --prod --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_DASHBOARD_PROJECT_ID }}
