name: CI Quality Gate

on:
  push:
    branches:
      - development
      - main
      - "feature/**"
  pull_request:
    branches:
      - development
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: CI Quality Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: ci-test-key
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_KEY: ci-test-key

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install test browsers
        run: |
          pnpm exec cypress install
          pnpm exec playwright install --with-deps chromium

      - name: Migrate database
        run: pnpm --dir database db:migrate

      - name: Lint
        run: pnpm lint

      - name: Type Check
        run: pnpm type-check

      - name: Build
        run: pnpm build

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Start API
        run: |
          pnpm --dir services/api start > api.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/health > /dev/null; then
              echo "API is ready"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to start"
          cat api.log
          exit 1

      - name: Start Web
        run: |
          pnpm --dir apps/web dev --host 0.0.0.0 > web.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://localhost:5173/ > /dev/null; then
              echo "Web app is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Web app failed to start"
          cat web.log
          exit 1

      - name: Unit Tests
        run: pnpm test:unit

      - name: Integration Tests
        run: pnpm test:integration

      - name: API Tests
        run: pnpm test:api

      - name: E2E Tests
        run: pnpm test:e2e

      - name: Analytics Tests
        run: pnpm test:analytics

      - name: Performance Tests
        run: pnpm test:performance

      - name: Security Tests
        run: pnpm test:security
